<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="950" viewBox="0 0 1860 950" role="img" aria-labelledby="title desc"><title id="title">Processing PII with Presidio</title><desc id="desc">The Seats feed has one Solace input queue. A .NET worker on AWS reads one Seats message at a time, parses the JSON with the Seats parser (every string value a candidate, located by its key path), identifies passenger names with Presidio running locally through Python.NET (the passengerName recognizer and the name keys in seats.xml; Presidio's predefined recognizers act only with Presidio:DefaultDetection on), masks them at the same width, rebuilds and validates the JSON message, and publishes it to the protected Seats topic. Other fields, and text in which nothing is detected, are published unchanged. Rejected input goes to the restricted Seats dead-letter queue. The input is acknowledged only after the broker confirms the output or dead letter.</desc><rect width="1860" height="950" fill="white"/><text x="930" y="69" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#292929">Processing PII with Presidio</text><rect x="30" y="110" width="1800" height="760" rx="30" fill="none" stroke="#8a9bad" stroke-width="2" stroke-dasharray="10 8"/><text x="60" y="145" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#666666">Customer AWS · private network</text><text x="175" y="385" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#666666">Solace broker</text><text x="175" y="418" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#292929">Input queue</text><rect x="70" y="430" width="210" height="80" rx="28" fill="white" stroke="#292929" stroke-width="2"/><rect x="88" y="441" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="175" y="476" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">Seats</text><text x="1685" y="385" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#666666">Solace broker</text><text x="1685" y="418" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#292929">Protected topic</text><rect x="1580" y="430" width="210" height="80" rx="28" fill="white" stroke="#292929" stroke-width="2"/><rect x="1598" y="441" width="174" height="58" rx="13" fill="white" stroke="#292929" stroke-width="2"/><text x="1685" y="476" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#292929">Seats</text><rect x="325" y="180" width="1210" height="580" rx="30" fill="#fcfcfc" stroke="#292929" stroke-width="2"/><text x="930" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#666666">.NET worker · ECS or EC2</text><rect x="360" y="330" width="150" height="280" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="435.0" y="428.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Receive</text><text x="435.0" y="468.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">FeedWorker</text><text x="435.0" y="493.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">Seats feed</text><rect x="550" y="330" width="170" height="280" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="635.0" y="428.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Parser</text><text x="635.0" y="468.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">Seats parser</text><text x="635.0" y="493.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">JSON</text><rect x="760" y="355" width="420" height="230" rx="28" fill="#f3f7fc" stroke="#292929" stroke-width="2"/><text x="970" y="392" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#225fba">PII protection</text><rect x="775" y="420" width="185" height="95" rx="18" fill="white" stroke="#292929" stroke-width="2"/><text x="867.5" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292929">Identification</text><text x="867.5" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#666666">seats.xml recognizers</text><rect x="990" y="420" width="175" height="95" rx="18" fill="white" stroke="#292929" stroke-width="2"/><text x="1077.5" y="460" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292929">Anonymization</text><text x="1077.5" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#666666">Local Presidio</text><polyline points="960,467 984,467" fill="none" stroke="#292929" stroke-width="2"/><polyline points="973.20,461.78 984,467 973.20,472.22" fill="none" stroke="#292929" stroke-width="2"/><text x="970" y="555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#666666">Action per entity, width kept</text><rect x="1215" y="330" width="150" height="280" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="1290.0" y="428.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Serializer</text><text x="1290.0" y="468.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">Rebuild</text><text x="1290.0" y="493.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">+ validate</text><rect x="1395" y="330" width="120" height="280" rx="20" fill="white" stroke="#292929" stroke-width="2"/><text x="1455.0" y="440.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292929">Publish</text><text x="1455.0" y="480.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666666">then ack</text><rect x="780" y="240" width="380" height="60" rx="16" fill="#f8fafc" stroke="#8a9bad" stroke-width="2"/><text x="970" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292929">Configuration</text><text x="970" y="289" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#666666">appsettings.json + seats.xml</text><polyline points="775,270 635,270 635,324" fill="none" stroke="#8a9bad" stroke-width="2" stroke-dasharray="8 6"/><polyline points="640.22,313.20 635,324 629.78,313.20" fill="none" stroke="#8a9bad" stroke-width="2"/><polyline points="970,305 970,320 820,320 820,414" fill="none" stroke="#8a9bad" stroke-width="2" stroke-dasharray="8 6"/><polyline points="825.22,403.20 820,414 814.78,403.20" fill="none" stroke="#8a9bad" stroke-width="2"/><polyline points="285,470 354,470" fill="none" stroke="#292929" stroke-width="2"/><polyline points="343.20,464.78 354,470 343.20,475.22" fill="none" stroke="#292929" stroke-width="2"/><polyline points="510,470 544,470" fill="none" stroke="#292929" stroke-width="2"/><polyline points="533.20,464.78 544,470 533.20,475.22" fill="none" stroke="#292929" stroke-width="2"/><polyline points="720,470 754,470" fill="none" stroke="#292929" stroke-width="2"/><polyline points="743.20,464.78 754,470 743.20,475.22" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1180,470 1209,470" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1198.20,464.78 1209,470 1198.20,475.22" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1365,470 1389,470" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1378.20,464.78 1389,470 1378.20,475.22" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1515,470 1574,470" fill="none" stroke="#292929" stroke-width="2"/><polyline points="1563.20,464.78 1574,470 1563.20,475.22" fill="none" stroke="#292929" stroke-width="2"/><text x="930" y="680" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#666666">Python.NET · presidio-analyzer · presidio-anonymizer · spaCy en_core_web_lg</text><text x="930" y="712" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#666666">PresidioDemo.Worker · PresidioDemo.Core · PresidioDemo.Messaging.Solace</text><rect x="1150" y="785" width="380" height="62" rx="16" fill="white" stroke="#8a8a8a" stroke-width="2"/><text x="1340" y="812" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292929">Dead-letter queue</text><text x="1340" y="836" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#666666">Rejected Seats input · restricted</text><polyline points="1455,615 1455,779" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="8 6"/><polyline points="1460.22,768.20 1455,779 1449.78,768.20" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="1442" y="700" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#666666">Rejected</text><text x="930" y="912" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#666666">Undetected text published unchanged  |  Native Solace client, no HTTP  |  Ack only after the broker confirms</text></svg>