<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 686" role="img" aria-labelledby="title desc">
<title id="title">Processing PII with Presidio: AWS deployment</title>
<desc id="desc">Harness builds one Docker image for the Seats worker, pushes it to ECR and deploys it as one ECS service. The Seats worker reads the Seats Solace input queue over a native TLS connection with parallel consumers, parses the JSON message, masks PII with Presidio in the same process, and publishes masked messages to the Seats topic, whose output queue serves downstream consumers. Failed messages go to the restricted Seats dead letter queue, with a broker backstop. The service scales automatically.</desc>
