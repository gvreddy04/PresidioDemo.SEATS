<!-- Notes -->
<line x1="40" y1="540" x2="1620" y2="540" stroke="#D3D1C7"/>
<text class="t" x="40" y="568">How it scales</text>
<text class="s" x="40" y="592">One service: the Seats worker.</text>
<text class="s" x="40" y="614">Parallel consumers in each task.</text>
<text class="s" x="40" y="636">Minimum sized for the normal peak.</text>

<text class="t" x="440" y="568">Dead letters</text>
<text class="s" x="440" y="592">Rejected messages go to the Seats DLQ.</text>
<text class="s" x="440" y="614">The broker moves stuck messages as a backstop.</text>
<text class="s" x="440" y="636">The DLQ has restricted access.</text>
<text class="s" x="440" y="658">Raw PII never goes to output.</text>

<text class="t" x="840" y="568">Worker settings</text>
<text class="s" x="840" y="592">One route: the Seats feed.</text>
<text class="s" x="840" y="614">Parallel consumers per task.</text>
<text class="s" x="840" y="636">Password from Secrets Manager.</text>
<text class="s" x="840" y="658">No AWS API calls from the worker.</text>
