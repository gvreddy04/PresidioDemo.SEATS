      .listener{fill:#f4f7fa;stroke:#b7c6d5;stroke-width:1.5}.stage{fill:white;stroke:#b7c6d5;stroke-width:1.2}
      .connection{fill:none;stroke:#3e556b;stroke-width:2;marker-end:url(#arrow)}
