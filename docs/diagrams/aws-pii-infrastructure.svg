<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">PII infrastructure on AWS</title>
  <desc id="desc">Proposed development infrastructure in a private AWS VPC for the Seats feed, drawn as one lane. The Seats producer publishes to the exclusive raw Seats queue on one Solace broker. One Seats listener task on ECS Fargate reads the queue one message at a time in arrival order. The listener parses the JSON Seats message, protects PII, serializes it back to the original format, validates the output and publishes it to the protected Seats topic, which consumers read through a subscribed queue. PII is protected with .NET and local Presidio embedded through Python.NET (pythonnet, presidio-analyzer, presidio-anonymizer, en_core_web_lg) using the seats.xml recognizer file, whose keys decide by JSON property; the PNR stays unchanged. The listener connects with a native client; there are no HTTP or remote PII calls. Input is acknowledged only after the protected publish succeeds; messages not acknowledged after retries move to the Seats dead-message queue, which quarantines raw PII with no consumer access. The replay owner for quarantined messages is to be confirmed. Broker ACLs let the listener read the raw queue and consumers read the protected topic only. The broker is one EC2 instance in a single Availability Zone with an EBS volume and no high availability in dev, to be confirmed. VPC endpoints carry platform traffic to Amazon ECR, S3, CloudWatch Logs and Secrets Manager, outside the PII path. The producer and consumer connection type is to be confirmed. Broker connections use TLS and the broker EBS volume is KMS encrypted. Protection is irreversible masking at the same width, and delivery is at least once, so consumers may see duplicates. The Presidio model is bundled with no runtime download. To be confirmed: no internet egress from the VPC, broker admin through SSM only, ECR image scanning, broker credentials in Secrets Manager, CloudWatch alarms on queue and dead-message depth, no PII in logs, and the dead-message retry count, retention and replay owner.</desc>
  <metadata>Project evidence: PresidioDemo.slnx; src/PresidioDemo.Worker/Program.cs; src/PresidioDemo.Worker/appsettings.json; src/PresidioDemo.Worker/Pipeline/FeedWorker.cs; src/PresidioDemo.Core/Decoder/SeatsParser.cs; src/PresidioDemo.Core/Protection/DetectingFeedProtector.cs; src/PresidioDemo.Core/Protection/python/presidio_demo.py; src/PresidioDemo.Core/Configuration/recognizers/seats.xml; src/PresidioDemo.Messaging.Solace/SolaceMessaging.cs. Current source runs one Solace consumer for the Seats feed (q.seats.raw), validates output before publishing it to the protected topic, acknowledges the input only after the broker confirms, and sends rejected input to the restricted dead-letter queue; the exclusive queue, the dead-message queue, broker ACLs and AWS deployment are proposed. No external documents used as evidence.</metadata>
